name: protocol-tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-c-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure host test target
        run: cmake -S . -B build-host -DBUILD_HOST_TESTS=ON
      - name: Build
        run: cmake --build build-host --parallel
      - name: Run protocol unit tests
        run: ctest --test-dir build-host --output-on-failure

  python-harness-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Python unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
